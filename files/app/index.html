<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<title>قص قص</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
  <header id="menubar">
    <div class="logo" title="قص قص"><span class="lg-mark"></span><b>قص قص</b></div>
    <nav id="menus" dir="rtl"></nav>
    <div id="workspaces" dir="rtl"></div>
    <div class="mb-right" dir="rtl">
      <span id="prjName" class="mb-prj" title="اسم المشروع"></span>
      <span class="mb-group"><button class="tb" id="btnUndo" title="تراجع (Ctrl+Z)"></button><button class="tb" id="btnRedo" title="إعادة (Ctrl+Shift+Z)"></button></span>
      <span id="ffWarn" class="warn" hidden>محرك التصدير غير متاح</span>
      <button class="btn pri" id="btnExport" title="تصدير الوسائط (Ctrl+M)">تصدير</button>
      <button class="tb" id="btnSettings" title="الإعدادات"></button>
    </div>
  </header>
  <main id="ws">
    <div id="wsMain">
      <div class="row" id="rowTop">
        <section class="frame" id="F_tl"><div class="tabs" dir="rtl"></div><div class="fbody"></div></section>
        <div class="split v" data-var="--c1"></div>
        <section class="frame" id="F_tr"><div class="tabs" dir="rtl"></div><div class="fbody"></div></section>
      </div>
      <div class="split h" data-var="--r1"></div>
      <div class="row" id="rowBot">
        <section class="frame" id="F_bl"><div class="tabs" dir="rtl"></div><div class="fbody"></div></section>
        <div class="split v" data-var="--c4"></div>
        <section class="frame" id="F_br"><div class="tabs" dir="rtl"></div><div class="fbody"></div></section>
      </div>
    </div>
    <div class="split v" id="sideSplit" data-var="--c3" data-side="1"></div>
    <section class="frame" id="F_side"><div class="tabs" dir="rtl"></div><div class="fbody"></div></section>
  </main>
  <footer id="status" dir="rtl"><span id="stMsg">جاهز</span><span class="grow"></span><span id="stSave" class="st-pill"></span><span id="stZoom" class="st-pill"></span><span id="stFps" class="st-pill" title="إطارات الواجهة في الثانية"></span><span id="stGpu"></span><span id="stSeq"></span></footer>
</div>

<div id="store" hidden></div>
<div id="vbin" aria-hidden="true"></div>
<div id="toast" class="toast" hidden></div>
<div id="dropHint" hidden><div>أفلت الملفات هنا لاستيرادها</div></div>

</body>
</html>
